# Publish GitHub Release assets when a tag matching "v*" is pushed (e.g. v3.2.0).
#
# Requires repo Actions secrets GPG_PRIVATE_KEY and PASSPHRASE (same names as
# terraform-provider-postgresql). GPG_FINGERPRINT is an output of the import
# step, not a secret. GITHUB_TOKEN is the default Actions token.
#
# permissions.contents: write is set in this workflow so goreleaser can create
# the GitHub Release without relying on repo-wide Actions write access.
name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Unshallow
        run: git fetch --prune --unshallow
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      -
        name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
